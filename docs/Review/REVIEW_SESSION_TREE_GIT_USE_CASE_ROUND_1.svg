  <text x="200" y="1025" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">版本关联域</text>
  <line x1="78" y1="1020" x2="108" y2="1020" stroke="#aaaaaa" stroke-width="1.2"/>
  <ellipse cx="460" cy="900" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="460" y="905" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">完整 SHA / 脏树拒绝</text>
  <ellipse cx="460" cy="980" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="977" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">索引零写入</text>
  <text x="460" y="993" text-anchor="middle" font-size="12" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">P1：需修复</text>
  <ellipse cx="460" cy="1060" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="1057" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">仅合格代码 Task 关联</text>
  <text x="460" y="1073" text-anchor="middle" font-size="12" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">P1：需修复</text>
  <ellipse cx="460" cy="1140" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="1137" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Task + SHA + 边界提示</text>
  <text x="460" y="1153" text-anchor="middle" font-size="12" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">P1：需修复</text>
  <line x1="290" y1="1020" x2="360" y2="900" stroke="#cccccc" stroke-width="1"/>
  <line x1="290" y1="1020" x2="360" y2="980" stroke="#cccccc" stroke-width="1"/>
  <line x1="290" y1="1020" x2="360" y2="1060" stroke="#cccccc" stroke-width="1"/>
  <line x1="290" y1="1020" x2="360" y2="1140" stroke="#cccccc" stroke-width="1"/>

  <!-- 图例：仅列本图实际使用的状态和域颜色 -->
  <rect x="1080" y="70" width="330" height="285" rx="8" fill="white" stroke="#cccccc" stroke-width="1.2"/>
  <text x="1245" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">图例</text>
  <ellipse cx="1165" cy="130" rx="70" ry="22" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="1165" y="135" text-anchor="middle" font-size="12" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">新增且通过</text>
  <text x="1300" y="135" text-anchor="middle" font-size="12" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">已满足计划</text>
  <ellipse cx="1165" cy="180" rx="70" ry="22" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="1165" y="185" text-anchor="middle" font-size="12" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">新增待改造</text>
  <text x="1300" y="185" text-anchor="middle" font-size="12" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Review 阻断</text>
  <ellipse cx="1165" cy="230" rx="70" ry="22" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="1165" y="235" text-anchor="middle" font-size="12" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Session 域</text>
  <ellipse cx="1165" cy="280" rx="70" ry="22" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="1.5"/>
  <text x="1165" y="285" text-anchor="middle" font-size="12" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">模型交互域</text>
  <ellipse cx="1165" cy="330" rx="70" ry="22" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="1165" y="335" text-anchor="middle" font-size="12" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">版本关联域</text>
</svg>
