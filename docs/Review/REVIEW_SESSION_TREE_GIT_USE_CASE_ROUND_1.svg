  <text x="200" y="705" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">模型交互域</text>
  <line x1="78" y1="700" x2="108" y2="700" stroke="#aaaaaa" stroke-width="1.2"/>
  <ellipse cx="460" cy="660" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="460" y="665" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">当前路径模型上下文</text>
  <ellipse cx="460" cy="740" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="460" y="745" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">首轮标题与失败隔离</text>
  <line x1="290" y1="700" x2="360" y2="660" stroke="#cccccc" stroke-width="1"/>
  <line x1="290" y1="700" x2="360" y2="740" stroke="#cccccc" stroke-width="1"/>

