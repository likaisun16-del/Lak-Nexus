  <ellipse cx="460" cy="420" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="417" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">失败消息可追踪</text>
  <text x="460" y="433" text-anchor="middle" font-size="12" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">P1：需修复</text>
  <ellipse cx="460" cy="500" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
