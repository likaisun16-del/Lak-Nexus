  <line x1="78" y1="300" x2="108" y2="300" stroke="#aaaaaa" stroke-width="1.2"/>

  <ellipse cx="460" cy="100" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="460" y="105" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">新建 / 列表 / 切换</text>
  <ellipse cx="460" cy="180" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
