<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260">
  <rect width="1500" height="1260" fill="white"/>
  <text x="750" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Session 树与 Git 版本关联 - 首轮 Review 用例图</text>

  <!-- 本地用户：W=300；Session 域 cy=300，子用例中位数=(260+340)/2=300 -->
  <circle cx="60" cy="282" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="300" x2="60" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="35" y1="318" x2="85" y2="318" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="340" x2="38" y2="370" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="340" x2="82" y2="370" stroke="#333" stroke-width="2"/>
  <text x="60" y="390" text-anchor="middle" font-size="14" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">本地用户</text>
  <ellipse cx="200" cy="300" rx="90" ry="32" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="1.5"/>
