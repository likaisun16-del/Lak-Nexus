  <ellipse cx="460" cy="260" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="460" y="265" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">分支保留与隔离</text>
  <ellipse cx="460" cy="340" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
