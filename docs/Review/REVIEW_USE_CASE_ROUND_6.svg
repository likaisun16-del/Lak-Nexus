  <text x="700" y="593" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">可进入提交阶段</text>

  <!-- 建议拆分到三级 -->
  <line x1="800" y1="500" x2="840" y2="460" stroke="#cccccc" stroke-width="1"/>
  <line x1="800" y1="500" x2="840" y2="540" stroke="#cccccc" stroke-width="1"/>
