  <text x="60" y="430" text-anchor="middle" font-size="14" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Reviewer</text>

  <!-- 域节点，一级用例 y=100..580，中位数=340 -->
  <ellipse cx="200" cy="340" rx="90" ry="32" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="200" y="336" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">第六轮</text>
  <text x="200" y="352" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">代码复审域</text>
  <line x1="78" y1="340" x2="108" y2="340" stroke="#aaaaaa" stroke-width="1.2"/>

