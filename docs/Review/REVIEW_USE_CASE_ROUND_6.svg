  <text x="700" y="740" text-anchor="middle" font-size="13" fill="#234f86" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">read 分页游标与模型可见正文已恢复一致；85 passed，2 skipped，无新增阻断项</text>
  <text x="700" y="762" text-anchor="middle" font-size="12" fill="#5b6f88" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">远程接入前仍需 OS 隔离、真实模型及时取消与不可跳过的链接安全测试</text>
