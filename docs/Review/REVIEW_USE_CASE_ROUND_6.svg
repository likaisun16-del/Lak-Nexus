<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <rect width="1400" height="840" fill="white"/>
  <text x="700" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">立凯中枢 - 第六轮代码复审用例图</text>

  <!-- Actor，W=340 -->
  <circle cx="60" cy="322" r="18" fill="none" stroke="#333" stroke-width="2"/>
