<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a8a8a8"/>
    </marker>
  </defs>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#111111" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">立凯中枢四工具 MVP - 第二轮复审用例图</text>
  <text x="750" y="68" text-anchor="middle" font-size="13" fill="#666666" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">绿色：上一轮问题已闭环　红色：本轮阻塞项　橙色：待完善契约</text>

  <!-- Actor：与域节点及一级用例中位线 y=350 对齐 -->
  <circle cx="70" cy="300" r="19" fill="none" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="319" x2="70" y2="362" stroke="#333333" stroke-width="2"/>
  <line x1="43" y1="338" x2="97" y2="338" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="362" x2="46" y2="397" stroke="#333333" stroke-width="2"/>
  <line x1="70" y1="362" x2="94" y2="397" stroke="#333333" stroke-width="2"/>
  <text x="70" y="422" text-anchor="middle" font-size="14" fill="#222222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">本地用户 / 审批者</text>

  <!-- Domain -->
  <ellipse cx="235" cy="350" rx="92" ry="34" fill="#7053a3" stroke="#7053a3" stroke-width="1.5"/>
  <text x="235" y="355" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">最小智能体域</text>
  <line x1="98" y1="350" x2="141" y2="350" stroke="#aaaaaa" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 一级用例 -->
  <ellipse cx="470" cy="120" rx="112" ry="31" fill="#eef9f1" stroke="#2f8f4e" stroke-width="1.7"/>
  <text x="470" y="125" text-anchor="middle" font-size="13" fill="#216837" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">CLI / Agent Loop</text>

  <ellipse cx="470" cy="235" rx="112" ry="31" fill="#fff7e6" stroke="#df8b13" stroke-width="1.7"/>
  <text x="470" y="240" text-anchor="middle" font-size="13" fill="#875000" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">read 分页读取</text>

  <ellipse cx="470" cy="350" rx="112" ry="31" fill="#eef9f1" stroke="#2f8f4e" stroke-width="1.7"/>
  <text x="470" y="355" text-anchor="middle" font-size="13" fill="#216837" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">write / edit 变更</text>

  <ellipse cx="470" cy="465" rx="112" ry="31" fill="#fff0f0" stroke="#c94242" stroke-width="1.8"/>
  <text x="470" y="470" text-anchor="middle" font-size="13" fill="#922b2b" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">bash 受控命令</text>

  <ellipse cx="470" cy="580" rx="112" ry="31" fill="#fff0f0" stroke="#c94242" stroke-width="1.8"/>
  <text x="470" y="585" text-anchor="middle" font-size="13" fill="#922b2b" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">审批与审计</text>

  <line x1="327" y1="350" x2="358" y2="120" stroke="#c7c7c7" stroke-width="1.1"/>
  <line x1="327" y1="350" x2="358" y2="235" stroke="#c7c7c7" stroke-width="1.1"/>
  <line x1="327" y1="350" x2="358" y2="350" stroke="#c7c7c7" stroke-width="1.1"/>
  <line x1="327" y1="350" x2="358" y2="465" stroke="#c7c7c7" stroke-width="1.1"/>
  <line x1="327" y1="350" x2="358" y2="580" stroke="#c7c7c7" stroke-width="1.1"/>

  <!-- 二级用例 / 审查结论 -->
  <ellipse cx="780" cy="120" rx="145" ry="31" fill="#eef9f1" stroke="#2f8f4e" stroke-width="1.7"/>
  <text x="780" y="125" text-anchor="middle" font-size="13" fill="#216837" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">任务异常进入明确终态</text>

  <ellipse cx="780" cy="235" rx="145" ry="31" fill="#fff7e6" stroke="#df8b13" stroke-width="1.7"/>
  <text x="780" y="240" text-anchor="middle" font-size="13" fill="#875000" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">输出预算与游标契约</text>

  <ellipse cx="780" cy="350" rx="145" ry="31" fill="#eef9f1" stroke="#2f8f4e" stroke-width="1.7"/>
  <text x="780" y="355" text-anchor="middle" font-size="13" fill="#216837" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">审批预览、摘要与漂移校验</text>

  <ellipse cx="780" cy="445" rx="145" ry="31" fill="#fff0f0" stroke="#c94242" stroke-width="1.8"/>
  <text x="780" y="450" text-anchor="middle" font-size="13" fill="#922b2b" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">识别并验证 Git Bash 运行时</text>

  <ellipse cx="780" cy="520" rx="145" ry="31" fill="#fff0f0" stroke="#c94242" stroke-width="1.8"/>
  <text x="780" y="525" text-anchor="middle" font-size="13" fill="#922b2b" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">跨工具拒绝敏感资源</text>

  <ellipse cx="780" cy="600" rx="145" ry="31" fill="#fff0f0" stroke="#c94242" stroke-width="1.8"/>
  <text x="780" y="605" text-anchor="middle" font-size="13" fill="#922b2b" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Bash 审批仅持久化最小摘要</text>

  <line x1="582" y1="120" x2="635" y2="120" stroke="#a8a8a8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="582" y1="235" x2="635" y2="235" stroke="#a8a8a8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="582" y1="350" x2="635" y2="350" stroke="#a8a8a8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="575" y1="452" x2="635" y2="445" stroke="#a8a8a8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="575" y1="472" x2="635" y2="510" stroke="#a8a8a8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="575" y1="575" x2="635" y2="600" stroke="#a8a8a8" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 右侧摘要 -->
  <rect x="1010" y="105" width="420" height="535" rx="12" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.3"/>
  <text x="1038" y="142" font-size="16" font-weight="bold" fill="#222222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">第二轮门禁摘要</text>

  <circle cx="1043" cy="180" r="7" fill="#2f8f4e"/>
  <text x="1062" y="185" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Shell 展开绕过已关闭</text>
  <circle cx="1043" cy="215" r="7" fill="#2f8f4e"/>
  <text x="1062" y="220" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">审计异常与任务终态已闭环</text>
  <circle cx="1043" cy="250" r="7" fill="#2f8f4e"/>
  <text x="1062" y="255" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">审批指纹与有界流读取已实现</text>

  <line x1="1035" y1="282" x2="1405" y2="282" stroke="#dddddd" stroke-width="1"/>
  <circle cx="1043" cy="320" r="7" fill="#c94242"/>
  <text x="1062" y="325" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Bash 可显式访问文件工具拒绝的凭据路径</text>
  <circle cx="1043" cy="365" r="7" fill="#c94242"/>
  <text x="1062" y="370" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">审批审计仍保存 Bash 原始 argv</text>
  <circle cx="1043" cy="410" r="7" fill="#c94242"/>
  <text x="1062" y="415" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">PATH 自动发现可能选中 WSL bash.exe</text>

  <line x1="1035" y1="447" x2="1405" y2="447" stroke="#dddddd" stroke-width="1"/>
  <circle cx="1043" cy="485" r="7" fill="#df8b13"/>
  <text x="1062" y="490" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">read 返回总量可能超过配置预算</text>
  <circle cx="1043" cy="530" r="7" fill="#df8b13"/>
  <text x="1062" y="535" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Bash 截断标记未进入模型可见内容</text>
  <circle cx="1043" cy="575" r="7" fill="#df8b13"/>
  <text x="1062" y="580" font-size="13" fill="#333333" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">真实模型取消仍为 best-effort</text>

  <rect x="1035" y="602" width="370" height="23" rx="5" fill="#fff0f0" stroke="#c94242" stroke-width="1"/>
  <text x="1220" y="618" text-anchor="middle" font-size="13" font-weight="bold" fill="#922b2b" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">门禁结论：CHANGES_REQUIRED</text>

  <text x="750" y="704" text-anchor="middle" font-size="14" fill="#555555" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">建议先统一敏感资源策略、修正 Bash 运行时发现与审计投影，再处理分页/截断契约和取消体验。</text>
</svg>
