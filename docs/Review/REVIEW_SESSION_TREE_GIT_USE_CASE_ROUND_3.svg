  <ellipse cx="1170" cy="275" rx="70" ry="22" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="1.5"/>
  <text x="1170" y="280" text-anchor="middle" font-size="12" fill="white" font-family="Noto Sans SC">版本关联域</text>
  <ellipse cx="1170" cy="325" rx="70" ry="22" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="1170" y="330" text-anchor="middle" font-size="12" fill="white" font-family="Noto Sans SC">验证门禁域</text>
