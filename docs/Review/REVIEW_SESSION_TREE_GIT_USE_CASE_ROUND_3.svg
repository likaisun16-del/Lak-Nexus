  <ellipse cx="460" cy="180" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="177" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">失败消息追踪</text>
  <text x="460" y="193" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">与重试关系</text>
  <ellipse cx="460" cy="260" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="257" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">跨 Session 继续</text>
  <text x="460" y="273" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">安全拒绝</text>
  <ellipse cx="460" cy="340" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
