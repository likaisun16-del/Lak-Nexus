<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260">
  <rect width="1500" height="1260" fill="white"/>
  <text x="750" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" font-family="Noto Sans SC">Session 树与 Git 版本关联 - 第三轮复审用例图</text>

  <!-- 本地用户 / Session 域：一级用例 y=100/180/260/340/420，中位数=260 -->
  <circle cx="60" cy="242" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="260" x2="60" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="35" y1="278" x2="85" y2="278" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="300" x2="38" y2="330" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="300" x2="82" y2="330" stroke="#333" stroke-width="2"/>
  <text x="60" y="350" text-anchor="middle" font-size="14" fill="#222" font-family="Noto Sans SC">本地用户</text>
  <ellipse cx="200" cy="260" rx="90" ry="32" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="200" y="265" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC">Session 会话域</text>
  <line x1="78" y1="260" x2="108" y2="260" stroke="#aaaaaa" stroke-width="1.2"/>

  <ellipse cx="460" cy="100" rx="100" ry="28" fill="#f8f8f8" stroke="#bbbbbb" stroke-width="1.5"/>
