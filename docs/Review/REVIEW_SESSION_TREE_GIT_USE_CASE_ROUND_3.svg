  <text x="460" y="633" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">安全读取</text>
  <ellipse cx="460" cy="700" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="697" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">Commit 关联</text>
  <text x="460" y="713" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">完整 SHA</text>
  <ellipse cx="460" cy="780" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="777" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">Task / SHA 查询</text>
  <text x="460" y="793" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">边界提示</text>
  <ellipse cx="460" cy="860" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="857" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">版本故障旁路</text>
  <text x="460" y="873" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">不阻断成功回答</text>
