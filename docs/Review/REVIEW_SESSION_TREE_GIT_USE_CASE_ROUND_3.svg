  <text x="460" y="353" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">拒绝且无关联</text>
  <ellipse cx="460" cy="420" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="417" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">最近消息时间</text>
  <text x="460" y="433" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC">与标题解耦</text>
