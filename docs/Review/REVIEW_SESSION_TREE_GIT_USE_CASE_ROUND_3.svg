  <line x1="290" y1="740" x2="360" y2="700" stroke="#cccccc" stroke-width="1"/>
  <line x1="290" y1="740" x2="360" y2="780" stroke="#cccccc" stroke-width="1"/>
  <line x1="290" y1="740" x2="360" y2="860" stroke="#cccccc" stroke-width="1"/>

  <!-- CI / Reviewer / 验证域：一级用例 y=1040/1120，中位数=1080 -->
  <circle cx="60" cy="1062" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="1080" x2="60" y2="1120" stroke="#333" stroke-width="2"/>
  <line x1="35" y1="1098" x2="85" y2="1098" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="1120" x2="38" y2="1150" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="1120" x2="82" y2="1150" stroke="#333" stroke-width="2"/>
  <text x="60" y="1170" text-anchor="middle" font-size="14" fill="#222" font-family="Noto Sans SC">CI / Reviewer</text>
  <ellipse cx="200" cy="1080" rx="90" ry="32" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="200" y="1085" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC">验证门禁域</text>
  <line x1="78" y1="1080" x2="108" y2="1080" stroke="#aaaaaa" stroke-width="1.2"/>
  <ellipse cx="460" cy="1040" rx="100" ry="28" fill="#f8f8f8" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="460" y="1037" text-anchor="middle" font-size="13" fill="#222" font-family="Noto Sans SC">186 项全量测试</text>
  <text x="460" y="1053" text-anchor="middle" font-size="13" fill="#222" font-family="Noto Sans SC">2 项 Windows 跳过</text>
  <ellipse cx="460" cy="1120" rx="100" ry="28" fill="#f8f8f8" stroke="#bbbbbb" stroke-width="1.5"/>
  <text x="460" y="1117" text-anchor="middle" font-size="13" fill="#222" font-family="Noto Sans SC">21 项专项回归</text>
  <text x="460" y="1133" text-anchor="middle" font-size="13" fill="#222" font-family="Noto Sans SC">CLI 与故障注入</text>
  <line x1="290" y1="1080" x2="360" y2="1040" stroke="#cccccc" stroke-width="1"/>
  <line x1="290" y1="1080" x2="360" y2="1120" stroke="#cccccc" stroke-width="1"/>

  <!-- 图例 -->
  <rect x="1080" y="60" width="340" height="340" rx="8" fill="white" stroke="#cccccc" stroke-width="1.2"/>
