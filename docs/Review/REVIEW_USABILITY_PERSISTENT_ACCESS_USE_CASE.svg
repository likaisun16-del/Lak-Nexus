  <ellipse cx="1200" cy="153" rx="70" ry="22" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="1200" y="158" text-anchor="middle" font-size="12" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">新增用例</text>
  <ellipse cx="1200" cy="203" rx="70" ry="22" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="1200" y="208" text-anchor="middle" font-size="12" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">改造用例</text>
  <ellipse cx="1200" cy="253" rx="70" ry="22" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="1200" y="258" text-anchor="middle" font-size="12" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">CLI 易用性域</text>
  <ellipse cx="1200" cy="303" rx="70" ry="22" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="1.5"/>
  <text x="1200" y="308" text-anchor="middle" font-size="12" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">数据存储域</text>

  <text x="1110" y="780" font-size="12" fill="#666" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">审查结果：除迁移冲突分支外，计划能力均有实现与测试证据。</text>
</svg>
